name: Vigia

# Confere de fora, a cada 3 horas, se o sistema responde e se o Cron da Cloudflare está rodando.
# Se algo precisar de você (Cron parado, Google expirado, pausa emergencial), a execução falha
# e o GitHub manda e-mail de aviso.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir saúde
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Vigia inativo até a Cloudflare ser configurada."
            exit 0
          fi
          node scripts/ci-deploy.mjs check
